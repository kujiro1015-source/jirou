<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リアルタイム金融ダッシュボード - マンハッタン・ナイト</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
            color: #f8fafc;

            /* 夜の都会をイメージしたグラデーション背景 */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card {
            background: rgba(30, 41, 59, 0.85); /* 半透明にして背景を少し透けさせる */
            max-width: 450px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px); /* 背景を少しぼかすおしゃれな効果 */
        }

        h2 {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .value {
            font-size: 36px;
            font-weight: bold;
            color: #38bdf8;
            transition: color 0.3s, text-shadow 0.3s;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        /* 更新時のアニメーション */
        .flash {
            color: #4ade80 !important;
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.8);
        }

        .update-time {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>🚀 MARKET WATCHER</h1>

    <!-- 現在時刻 -->
    <div class="card">
        <h2>NOW (Aichi, Japan)</h2>
        <div id="clock" class="value" style="font-size: 28px; color: #f8fafc;">00:00:00</div>
    </div>

    <!-- 本物の為替データ（ドル円） -->
    <div class="card">
        <h2>USD / JPY Rate 【REAL-TIME】</h2>
        <div id="forex-price" class="value">CONNECTING...</div>
        <div id="update-info" class="update-time">Status: Waiting...</div>
    </div>

    <script>
        // 時計
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // リアルタイムデータ取得
        async function fetchRealData() {
            const priceElement = document.getElementById('forex-price');
            const infoElement = document.getElementById('update-info');

            try {
                // 為替データAPI
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                
                if (!response.ok) throw new Error('Fetch failed');

                const data = await response.json();
                const jpyRate = data.rates.JPY;
                
                priceElement.innerText = jpyRate.toFixed(2) + ' JPY';

                // 更新演出
                priceElement.classList.add('flash');
                setTimeout(() => priceElement.classList.remove('flash'), 1000);

                // 更新時刻
                const now = new Date();
                infoElement.innerText = `LAST UPDATE: ${now.toLocaleTimeString()} (Auto-refresh)`;

            } catch (error) {
                priceElement.innerText = 'ERROR';
                infoElement.innerText = 'Check internet connection';
            }
        }

        fetchRealData();
        setInterval(fetchRealData, 10000); // 10秒ごと
    </script>

</body>
</html>
