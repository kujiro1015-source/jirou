<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>じろうのアプリ</title>
</head>
<body>
    <h1 id="message">こんにちは！</h1>
    <button onclick="changeText()">ボタンを押してね</button>

    <script>
        function changeText() {
            document.getElementById('message').innerText = 'アプリへようこそ！';
        }
    </script>
</body>
</html>
